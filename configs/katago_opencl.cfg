# KataGo OpenCL Configuration for Backup HTTP Server
# Based on katago_gtp.cfg, optimized for OpenCL

# === Basic Settings ===
logDir = /app/logs
logAllGTPCommunication = true
logSearchInfo = false
logToStderr = false

# === Search Settings ===
# GPU mode settings
maxVisits = 800
maxPlayouts = 3200
maxTime = 15.0

# GPU search threads
numSearchThreads = 16

# === Neural Net Settings ===
# OpenCL batch size
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
nnPolicyTemperature = 1.0

# === OpenCL Specific Settings ===
# Change to true if your GPU supports FP16 for better performance
openclUseFP16 = auto
# Selected GPU to use (0 is usually the first GPU)
openclGpuToUse = 0

# === Search Parameters ===
cpuctExploration = 1.0
cpuctExplorationLog = 0.45
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

# === Rules ===
rules = tromp-taylor

# === Performance Tuning ===
numNNServerThreadsPerModel = 2
numAnalysisThreads = 4

# === GTP Settings ===
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3

# === Output Format ===
reportAnalysisWinratesAs = BLACK
reportDuringSearchEvery = 0.5
