events {
    worker_connections 1024;
}

http {
    # 增加超时时间，防止 AI 分析过久导致 Nginx 断开连接
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;

    upstream katago_backend {
        # 核心配置：使用请求头中的 X-Game-Hash 进行一致性哈希分配
        # 只要前台传入相同的前 50 步 Hash，请求就一定会落在同一台机器
        hash $http_x_game_hash consistent;

        # 现有的两个 KataGo 容器引擎
        server host.docker.internal:8080;
        server host.docker.internal:8079;
        
        # 预留给未来的扩容引擎 (Up to 5)
        # 只要修改了这里的端口，并把对应的 `#` 删掉，并重新执行 `docker restart katago-nginx-lb` 即可生效。
        # 由于我们使用了 `consistent` 关键字，随时加减机器只会影响迁移走的那一小部分数据，
        # 大部分之前的棋谱 Hash 依然会命中旧的机器！
        # server host.docker.internal:8078;
        # server host.docker.internal:8077;
        # server host.docker.internal:8076;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://katago_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 允许跨域请求透传
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Game-Hash' always;

            # 拦截 OPTIONS 请求并直接返回 204，防止打到后端
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}
